    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parking Management System</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
        <style>
            body {
                background-color: #f8f9fa;
            }
            .header {
                background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
                color: white;
                padding: 2rem 0;
                margin-bottom: 2rem;
            }
            .card {
                border: none;
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                margin-bottom: 1rem;
            }
            .table {
                background-color: white;
                border-radius: 10px;
            }
            .status-badge {
                padding: 0.5em 1em;
                border-radius: 20px;
                font-size: 0.85em;
            }
            .status-paid {
                background-color: #d4edda;
                color: #155724;
            }
            .status-pending {
                background-color: #fff3cd;
                color: #856404;
            }
            .refresh-btn {
                position: fixed;
                bottom: 2rem;
                right: 2rem;
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background: #1e3c72;
                color: white;
                border: none;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                transition: transform 0.2s;
            }
            .refresh-btn:hover {
                transform: rotate(180deg);
            }
            .last-update {
                font-size: 0.9em;
                color: #6c757d;
                margin-top: 1rem;
            }
            .action-buttons {
                margin-bottom: 1rem;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="container">
                <h1><i class="bi bi-p-square"></i> Parking Management System</h1>
                <p class="lead">Real-time parking logs and status</p>
            </div>
        </div>

        <!-- filepath: c:\Users\user\Documents\GABBY-Y3\NE\parking-management-system - Copy\parking_ui\templates\index.html -->
<div class="container">
    <div class="row">
        <!-- Parking Logs Table -->
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Parking Logs</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Plate Number</th>
                                    <th>Entry Time</th>
                                    <th>Exit Time</th>
                                    <th>Payment Status</th>
                                    <th>Amount Paid</th>
                                    <th>Parking Status</th>
                                </tr>
                            </thead>
                            <tbody id="parkingLogs">
                                <!-- Data will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Unauthorized Exit Attempts Table -->
        <div class="col-12 mt-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Unauthorized Exit Attempts</h5>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Plate Number</th>
                                    <th>Attempt Time</th>
                                    <th>Reason</th>
                                </tr>
                            </thead>
                            <tbody id="unauthorizedExits">
                                <!-- Data will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Fetch parking logs
    function fetchParkingLogs() {
        fetch('/api/parking-logs')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('parkingLogs');
                tbody.innerHTML = '';
                data.forEach(log => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${log.plate_number}</td>
                        <td>${log.entry_time}</td>
                        <td>${log.exit_time || 'N/A'}</td>
                        <td>${log.payment_status}</td>
                        <td>${log.amount_paid || 'N/A'}</td>
                        <td>${log.parking_status}</td>
                    `;
                    tbody.appendChild(row);
                });
            });
    }

    // Fetch unauthorized exits
    function fetchUnauthorizedExits() {
        fetch('/api/unauthorized-exits')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('unauthorizedExits');
                tbody.innerHTML = '';
                data.forEach(exit => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${exit.plate_number}</td>
                        <td>${exit.attempt_time}</td>
                        <td>${exit.reason}</td>
                    `;
                    tbody.appendChild(row);
                });
            });
    }

    // Fetch data on page load
    fetchParkingLogs();
    fetchUnauthorizedExits();
</script>
    </body>
    </html>
